# Publishes the rules in force to rekati.org/aturan. On every change to ATURAN.md on main, copies it into the site
# repo (rekati-org/rekati, site/src/rules/ATURAN.md) and pushes to its main branch, which deploys the site.
# The push uses a deploy key with write access to rekati-org/rekati only: the private half is the
# REKATI_SITE_DEPLOY_KEY secret here, the public half is a deploy key on the site repo.
name: terbitkan

on:
  push:
    branches: [main]
    paths: [ATURAN.md]
  workflow_dispatch:

concurrency: terbitkan

permissions:
  contents: read

env:
  DEST: site/src/rules/ATURAN.md

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tata-kelola
      - uses: actions/checkout@v4
        with:
          repository: rekati-org/rekati
          ssh-key: ${{ secrets.REKATI_SITE_DEPLOY_KEY }}
          path: rekati
      - name: Salin ATURAN.md ke repo situs
        working-directory: rekati
        run: |
          cp ../tata-kelola/ATURAN.md "$DEST"
          if git diff --quiet; then
            echo "Aturan di situs sudah sama."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Aturan Komunitas: terbitkan dari tata-kelola@${GITHUB_SHA::7}"
          git push origin HEAD:main
